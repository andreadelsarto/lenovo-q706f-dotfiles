<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Outer Handheld Body -->
  <rect x="40" y="110" width="432" height="292" rx="48" fill="#1e293b" stroke="url(#deckGrad)" stroke-width="8" />
  
  <!-- Left Grip Curve Accent -->
  <path d="M 44 180 Q 70 256 44 332" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  
  <!-- Right Grip Curve Accent -->
  <path d="M 468 180 Q 442 256 468 332" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  
  <!-- Left D-Pad -->
  <rect x="76" y="210" width="16" height="48" rx="4" fill="#475569" />
  <rect x="60" y="226" width="48" height="16" rx="4" fill="#475569" />
  
  <!-- Left Thumbstick -->
  <circle cx="84" cy="300" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <circle cx="84" cy="300" r="12" fill="#334155" />
  
  <!-- Right ABXY Action Buttons -->
  <circle cx="428" cy="205" r="8" fill="#ef4444" />
  <circle cx="448" cy="225" r="8" fill="#3b82f6" />
  <circle cx="408" cy="225" r="8" fill="#eab308" />
  <circle cx="428" cy="245" r="8" fill="#22c55e" />
  
  <!-- Right Thumbstick -->
  <circle cx="428" cy="300" r="22" fill="#0f172a" stroke="#22c55e" stroke-width="3" />
  <circle cx="428" cy="300" r="12" fill="#334155" />
  
  <!-- Center OLED Screen -->
  <rect x="132" y="145" width="248" height="222" rx="16" fill="url(#screenGrad)" stroke="#334155" stroke-width="4" />
  
  <!-- KDE Plasma Gear / Steam Deck Helix Emblem -->
  <g transform="translate(256, 240)">
    <!-- Rotating Plasma Halo -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="url(#deckGrad)" stroke-width="6" stroke-dasharray="14 10" />
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    
    <!-- Central KDE Plasma Logo Sparkle -->
    <path d="M -12 -12 L 12 12 M 12 -12 L -12 12" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
    <circle cx="-16" cy="0" r="4" fill="#22c55e" />
    <circle cx="16" cy="0" r="4" fill="#38bdf8" />
    <circle cx="0" cy="-16" r="4" fill="#0284c7" />
  </g>
  
  <!-- Bottom Brand Text -->
  <text x="256" y="340" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="16" letter-spacing="4">PLASMA DECK</text>
</svg>
